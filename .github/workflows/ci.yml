name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pizzalogs
          POSTGRES_PASSWORD: pizzalogs
          POSTGRES_DB: pizzalogs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pizzalogs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pizzalogs:pizzalogs@localhost:5432/pizzalogs?schema=public
      PARSER_SERVICE_URL: http://localhost:8000
      ADMIN_SECRET: ci-placeholder-not-production
      TEST_DATABASE_URL: postgresql://pizzalogs:pizzalogs@localhost:5432/pizzalogs
      PARSER_CONTRACT_PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install hash-locked parser dependencies
        run: pip install --require-hashes -r parser/requirements-dev.lock

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Fresh database migration and seed
        run: |
          node scripts/adopt-legacy-migrations.mjs node_modules/prisma/build/index.js
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          npm run db:seed

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: TypeScript ecosystem compatibility
        run: npm run type-check:ecosystem

      - name: Test
        run: npm test --if-present

      - name: Documentation and lock consistency
        run: |
          npm run docs:check
          npm run locks:check

      - name: Parser tests
        run: |
          cd parser
          pytest tests/ -v

      - name: Python static and security checks
        run: |
          python -m ruff check parser --select F,E9
          python -m bandit -q -r parser -x parser/tests,parser/benchmarks,parser/.venv
          python -m pip_audit -r parser/requirements.lock --disable-pip

      - name: Offline differential reference regression
        working-directory: parser
        run: python -m parity verify --output-dir ../.test-artifacts/parity

      - name: Build
        run: npm run build

      - name: Build production containers
        run: |
          docker build -t pizza-logs-web:ci .
          docker build -f parser/Dockerfile -t pizza-logs-parser:ci .
          docker run --rm --network none -e DATABASE_URL pizza-logs-web:ci node node_modules/prisma/build/index.js --version

      - name: Test parser on its production operating system
        run: |
          docker build --target test -f parser/Dockerfile -t pizza-logs-parser:test .
          docker run --rm --network none --cpus 2 --memory 512m pizza-logs-parser:test

      - name: Scan complete runtime images and retain SBOMs
        run: |
          mkdir -p .test-artifacts/container-security
          for service in web parser; do
            docker image inspect --format '{{.Id}}' "pizza-logs-$service:ci" > ".test-artifacts/container-security/$service.image-id"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$PWD/.test-artifacts/container-security:/out" \
              -v pizza-trivy-cache:/root/.cache/trivy \
              ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --list-all-pkgs --format json --output "/out/$service.json" "pizza-logs-$service:ci"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$PWD/.test-artifacts/container-security:/out" \
              -v pizza-trivy-cache:/root/.cache/trivy \
              ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --format cyclonedx --output "/out/$service.cdx.json" "pizza-logs-$service:ci"
          done
          # Trivy runs as root; the runner adds attribution after validating IDs.
          sudo chown "$(id -u):$(id -g)" .test-artifacts/container-security/{web,parser}.cdx.json
          node scripts/check-container-scans.mjs .test-artifacts/container-security

      - name: Integrated containers and headless acceptance
        run: |
          npx playwright install --with-deps chromium
          docker run -d --name pizza-parser-ci --network host pizza-logs-parser:ci
          docker run -d --name pizza-web-ci --network host -e DATABASE_URL -e PARSER_SERVICE_URL -e ADMIN_SECRET -e ADMIN_COOKIE_SECURE=false pizza-logs-web:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready; then break; fi
            sleep 2
          done
          npm run test:e2e

      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-acceptance
          path: .test-artifacts/
          include-hidden-files: true
          retention-days: 90

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
