name: Production Smoke

on:
  deployment_status:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional deployment URL to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      endsWith(github.event.deployment.environment, 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PIZZA_LOGS_BASE_URL: ${{ inputs.base_url || 'https://pizza-logs-production.up.railway.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify production routes
        run: node scripts/production-smoke.mjs
