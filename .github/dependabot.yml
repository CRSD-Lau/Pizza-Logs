version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Halifax
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # These majors need coordinated framework/runtime migrations. The project
    # already checks TypeScript 7 through @typescript/native while the ESLint
    # ecosystem remains on its compatible stable majors.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /parser
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Halifax
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Halifax
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Halifax
    open-pull-requests-limit: 3
    # Production follows Node LTS. Major upgrades are reviewed when the next
    # release reaches LTS rather than while it is in the Current channel.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /parser
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Halifax
    open-pull-requests-limit: 3
